name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/myagent/app
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MyAgent"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.myagent.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.myagent.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.3"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application android:label="MyAgent" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/myagent/app/MainActivity.kt <<'EOF'
          package com.myagent.app

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.telephony.SmsManager
          import android.text.InputType
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private lateinit var keyBox: EditText
              private lateinit var modelBox: EditText
              private lateinit var status: TextView
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private val prefs by lazy { getSharedPreferences("agent", Context.MODE_PRIVATE) }
              private val history = ArrayList<Pair<String, String>>()

              private val SYS = """أنت مساعد صوتي على تلفون أندرويد. رد دائماً بـ JSON فقط بهذا الشكل: {"action":"chat","target":"","message":"","reply":""}
          القيم الممكنة لـ action:
          chat: محادثة أو سؤال عادي أو سؤال عن شيء ناقص. ضع الجواب في reply بالعربية البسيطة وباختصار.
          open_app: فتح تطبيق. target اسم التطبيق بالإنجليزية كما يظهر على التلفون مثل WhatsApp أو YouTube أو Chrome.
          call: اتصال. target اسم الشخص كما قاله المستخدم أو الرقم.
          send_sms: رسالة نصية. target اسم الشخص أو الرقم، و message نص الرسالة فقط.
          remember: حفظ معلومة طلب المستخدم أن تتذكرها. message نص المعلومة بصيغة واضحة مثل: رقم أنس الملك 0912345678.
          forget: نسيان معلومة محفوظة. target كلمة مفتاحية موجودة في المعلومة.
          قواعد:
          لا تحفظ كلمات السر ولا أرقام البطاقات ولا معلومات بنكية. ارفض ذلك بلطف بإجراء chat.
          إذا كانت المعلومات المحفوظة تحتوي على رقم الشخص المطلوب فضع الرقم في target عند الاتصال أو الرسالة.
          إذا ناقص شيء لتنفيذ الأمر مثل اسم الشخص أو نص الرسالة فاسأل عنه بإجراء chat، وستصلك إجابة المستخدم في الرسالة التالية.
          في reply ضع جملة قصيرة تؤكد ما ستفعله."""

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  tts = TextToSpeech(this, this)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(40, 80, 40, 40)
                  keyBox = EditText(this)
                  keyBox.hint = "Gemini API key"
                  keyBox.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  keyBox.setText(prefs.getString("key", ""))
                  modelBox = EditText(this)
                  modelBox.hint = "Model"
                  modelBox.setText(prefs.getString("model", "gemini-2.5-flash"))
                  val mic = Button(this)
                  mic.text = "🎤 اضغط وتكلم"
                  mic.textSize = 20f
                  mic.setOnClickListener { startListening() }
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val memBtn = Button(this)
                  memBtn.text = "🧠 الذاكرة"
                  memBtn.setOnClickListener { showMem() }
                  val newBtn = Button(this)
                  newBtn.text = "🔄 محادثة جديدة"
                  newBtn.setOnClickListener { history.clear(); log("بدأنا محادثة جديدة") }
                  row.addView(memBtn, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(newBtn, LinearLayout.LayoutParams(0, -2, 1f))
                  status = TextView(this)
                  status.textSize = 16f
                  val scroll = ScrollView(this)
                  scroll.addView(status)
                  root.addView(keyBox)
                  root.addView(modelBox)
                  root.addView(mic)
                  root.addView(row)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)
                  val need = listOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS
                  ).filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 1)
              }

              override fun onInit(s: Int) {
                  tts?.language = Locale("ar")
              }

              private fun log(s: String) = runOnUiThread { status.append(s + "\n\n") }

              private fun say(s: String) {
                  log("المساعد: " + s)
                  runOnUiThread { tts?.speak(s, TextToSpeech.QUEUE_FLUSH, null, "a") }
              }

              private fun getMem(): List<String> =
                  (prefs.getString("mem", "") ?: "").split("\n").filter { it.isNotBlank() }

              private fun saveMem(l: List<String>) {
                  prefs.edit().putString("mem", l.joinToString("\n")).apply()
              }

              private fun remember(fact: String, reply: String) {
                  val f = fact.trim().replace("\n", " ")
                  if (f.isBlank()) { say("ما فهمت إيش أتذكر"); return }
                  val l = getMem().toMutableList()
                  if (l.joinToString("\n").length + f.length > 4000) { say("الذاكرة ممتلئة، امسح بعضها"); return }
                  l.add(f)
                  saveMem(l)
                  say(if (reply.isBlank()) "تمام، حفظت" else reply)
              }

              private fun forget(t: String) {
                  val l = getMem()
                  val key = t.trim().lowercase()
                  if (key.isBlank()) { say("ما فهمت إيش أنسى"); return }
                  val keep = l.filter { !it.lowercase().contains(key) }
                  saveMem(keep)
                  if (keep.size == l.size) say("ما لقيت شي عن " + t)
                  else say("نسيت " + (l.size - keep.size) + " معلومة")
              }

              private fun showMem() {
                  val l = getMem()
                  val text = if (l.isEmpty()) "الذاكرة فاضية" else l.mapIndexed { i, s -> "" + (i + 1) + ". " + s }.joinToString("\n")
                  AlertDialog.Builder(this)
                      .setTitle("الذاكرة")
                      .setMessage(text)
                      .setPositiveButton("إغلاق", null)
                      .setNegativeButton("مسح الكل") { _, _ ->
                          saveMem(emptyList())
                          history.clear()
                          log("تم مسح الذاكرة")
                      }
                      .show()
              }

              private fun startListening() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      log("اسمح بصلاحية الميكروفون ثم اضغط مرة أخرى")
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 2)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      log("خدمة التعرف على الصوت غير متوفرة")
                      return
                  }
                  prefs.edit()
                      .putString("key", keyBox.text.toString().trim())
                      .putString("model", modelBox.text.toString().trim())
                      .apply()
                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) { log("🎧 أسمعك...") }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(e: Int) { log("خطأ في التعرف على الصوت: " + e) }
                      override fun onResults(r: Bundle?) {
                          val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t.isNullOrBlank()) { log("ما سمعت شي"); return }
                          log("أنت: " + t)
                          askGemini(t)
                      }
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                  recognizer?.startListening(i)
              }

              private fun callModel(model: String, key: String, body: String): Pair<Int, String> {
                  val c = URL("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("x-goog-api-key", key)
                  c.doOutput = true
                  c.connectTimeout = 20000
                  c.readTimeout = 60000
                  c.outputStream.use { it.write(body.toByteArray()) }
                  val code = c.responseCode
                  val txt = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().use { it.readText() }
                  return Pair(code, txt)
              }

              private fun textPart(role: String, text: String): JSONObject =
                  JSONObject().put("role", role).put("parts", JSONArray().put(JSONObject().put("text", text)))

              private fun askGemini(q: String) {
                  val key = prefs.getString("key", "") ?: ""
                  val chosen = (prefs.getString("model", "") ?: "").trim()
                  if (key.isBlank()) { log("اكتب مفتاح Gemini أولاً"); return }
                  val mem = getMem()
                  val sysText = if (mem.isEmpty()) SYS else SYS + "\n\nمعلومات محفوظة عن المستخدم:\n" + mem.joinToString("\n")
                  val contents = JSONArray()
                  for (h in history) contents.put(textPart(h.first, h.second))
                  contents.put(textPart("user", q))
                  val sys = JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sysText)))
                  val gen = JSONObject().put("responseMimeType", "application/json")
                  val body = JSONObject().put("system_instruction", sys).put("contents", contents).put("generationConfig", gen).toString()
                  thread {
                      try {
                          val models = listOf(chosen, "gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-flash-latest")
                              .filter { it.isNotBlank() }.distinct()
                          var lastErr = ""
                          for (m in models) {
                              for (attempt in 1..2) {
                                  val res = callModel(m, key, body)
                                  val code = res.first
                                  val txt = res.second
                                  if (code in 200..299) {
                                      val ans = JSONObject(txt).getJSONArray("candidates").getJSONObject(0)
                                          .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                                      runOnUiThread {
                                          history.add(Pair("user", q))
                                          history.add(Pair("model", ans))
                                          while (history.size > 10) history.removeAt(0)
                                          handle(ans)
                                      }
                                      return@thread
                                  }
                                  lastErr = "خطأ " + code + " (" + m + "): " + txt.take(150)
                                  if (code == 400 || code == 401 || code == 403) {
                                      log(lastErr + "\nتأكد من المفتاح")
                                      return@thread
                                  }
                                  if (code == 503 || code == 429 || code == 500) {
                                      log("⏳ " + m + " مشغول، أعيد المحاولة...")
                                      Thread.sleep(1500)
                                      continue
                                  }
                                  break
                              }
                          }
                          log("فشلت كل المحاولات.\n" + lastErr)
                      } catch (e: Exception) {
                          log("خطأ: " + e.message)
                      }
                  }
              }

              private fun handle(raw: String) {
                  val clean = raw.replace("```json", "").replace("```", "").trim()
                  val j = try { JSONObject(clean) } catch (e: Exception) { null }
                  if (j == null) { say(raw); return }
                  val action = j.optString("action", "chat")
                  val target = j.optString("target", "")
                  val msg = j.optString("message", "")
                  val reply = j.optString("reply", "")
                  when (action) {
                      "open_app" -> openApp(target)
                      "call" -> confirmCall(target)
                      "send_sms" -> confirmSms(target, msg)
                      "remember" -> remember(if (msg.isBlank()) target else msg, reply)
                      "forget" -> forget(target)
                      else -> say(if (reply.isBlank()) raw else reply)
                  }
              }

              private fun openApp(name: String) {
                  val pm = packageManager
                  val i = Intent(Intent.ACTION_MAIN)
                  i.addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(i, 0)
                  val q = name.trim().lowercase()
                  val hit = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                  val launch = if (hit != null) pm.getLaunchIntentForPackage(hit.activityInfo.packageName) else null
                  if (launch == null || q.isBlank()) {
                      say("ما لقيت تطبيق باسم " + name)
                      return
                  }
                  say("أفتح " + hit!!.loadLabel(pm))
                  startActivity(launch)
              }

              private fun normalizeDigits(s: String): String {
                  val sb = StringBuilder()
                  for (c in s) {
                      if (c in '٠'..'٩') sb.append(c - '٠') else sb.append(c)
                  }
                  return sb.toString()
              }

              private fun findContact(name: String): Pair<String, String>? {
                  val digits = normalizeDigits(name).replace(" ", "").replace("-", "")
                  if (digits.length >= 5 && digits.all { it.isDigit() || it == '+' }) return Pair(digits, digits)
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                      log("صلاحية جهات الاتصال غير مفعّلة")
                      return null
                  }
                  val c = contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                      arrayOf("%" + name.trim() + "%"),
                      null
                  )
                  c?.use {
                      if (it.moveToFirst()) return Pair(it.getString(0), it.getString(1))
                  }
                  return null
              }

              private fun confirmCall(target: String) {
                  val c = findContact(target)
                  if (c == null) { say("ما لقيت جهة اتصال باسم " + target); return }
                  say("هل أتصل بـ " + c.first + "؟")
                  AlertDialog.Builder(this)
                      .setTitle("اتصال")
                      .setMessage("أتصل بـ " + c.first + "؟\n" + c.second)
                      .setPositiveButton("اتصل") { _, _ -> doCall(c.second) }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun doCall(number: String) {
                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
                      log("صلاحية الاتصال غير مفعّلة")
                      return
                  }
                  startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(number))))
              }

              private fun confirmSms(target: String, text: String) {
                  if (text.isBlank()) { say("ما فهمت نص الرسالة"); return }
                  val c = findContact(target)
                  if (c == null) { say("ما لقيت جهة اتصال باسم " + target); return }
                  say("هل أرسل لـ " + c.first + " رسالة تقول: " + text + "؟")
                  AlertDialog.Builder(this)
                      .setTitle("إرسال رسالة")
                      .setMessage("إلى: " + c.first + "\n" + c.second + "\n\n" + text)
                      .setPositiveButton("إرسال") { _, _ -> doSms(c.second, text) }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              @Suppress("DEPRECATION")
              private fun doSms(number: String, text: String) {
                  if (checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                      log("صلاحية الرسائل غير مفعّلة")
                      return
                  }
                  try {
                      val sm = if (Build.VERSION.SDK_INT >= 31) getSystemService(SmsManager::class.java) else SmsManager.getDefault()
                      sm.sendMultipartTextMessage(number, null, sm.divideMessage(text), null, null)
                      say("تم إرسال الرسالة")
                  } catch (e: Exception) {
                      log("فشل الإرسال: " + e.message)
                  }
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyAgent-APK
          path: app/build/outputs/apk/debug/app-debug.apk
