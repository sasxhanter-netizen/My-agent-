name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK for easier download
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Anubis-v3.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anubis-APK
          path: app/build/outputs/apk/debug/Anubis-v3.3.apk

      - name: Upload ObjectBox model
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objectbox-model
          path: app/objectbox-models/default.json
          if-no-files-found: warn
