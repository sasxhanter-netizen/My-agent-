          cat > app/src/main/java/com/myagent/app/AvatarView.kt <<'EOF'
          package com.myagent.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View

          class AvatarView(ctx: Context) : View(ctx) {
              var state = 0
              var surprised = false
              var walking = false
              private var hopAt = 0L
              private val t0 = System.nanoTime()
              private var attached = false
              private val PI = Math.PI.toFloat()

              private val body = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG)
              private val head = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dark = Paint(Paint.ANTI_ALIAS_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ear = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ball = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              init {
                  head.color = 0xFFECEFF1.toInt()
                  dark.color = 0xFF263238.toInt()
                  ear.color = 0xFFB0BEC5.toInt()
                  ball.color = 0xFFFFC107.toInt()
                  ring.style = Paint.Style.STROKE
                  line.style = Paint.Style.STROKE
                  line.strokeCap = Paint.Cap.ROUND
              }

              fun hop() {
                  hopAt = System.nanoTime()
              }

              private fun hopping(): Boolean = hopAt != 0L && (System.nanoTime() - hopAt) < 450000000L

              private fun sn(x: Float): Float = Math.sin(x.toDouble()).toFloat()

              private fun cs(x: Float): Float = Math.cos(x.toDouble()).toFloat()

              private fun stateColor(): Int = when (state) {
                  1 -> 0xFF2E7D32.toInt()
                  2 -> 0xFFEF6C00.toInt()
                  3 -> 0xFF1565C0.toInt()
                  else -> 0xFF455A64.toInt()
              }

              private val frame = object : Runnable {
                  override fun run() {
                      invalidate()
                      if (attached) {
                          val busy = state != 0 || walking || surprised || hopping()
                          postDelayed(this, if (busy) 16L else 66L)
                      }
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  attached = true
                  post(frame)
              }

              override fun onDetachedFromWindow() {
                  attached = false
                  removeCallbacks(frame)
                  super.onDetachedFromWindow()
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val s = Math.min(w, h)
                  val cx = w / 2f
                  val cy = h / 2f
                  val now = System.nanoTime()
                  val t = (now - t0) / 1e9f
                  val r = s * 0.38f
                  val col = stateColor()

                  if (state == 1) {
                      for (k in 0..1) {
                          val ph = (t * 0.9f + k * 0.5f) % 1f
                          val rad = r + (s * 0.5f - r) * ph
                          ring.color = col
                          ring.alpha = ((1f - ph) * 150f).toInt()
                          ring.strokeWidth = s * 0.025f
                          canvas.drawCircle(cx, cy, rad, ring)
                      }
                  }
                  if (state == 2) {
                      for (i in 0..2) {
                          val a = t * 3.5f + i * 2.0944f
                          body.color = Color.WHITE
                          canvas.drawCircle(cx + r * 1.22f * cs(a), cy + r * 1.22f * sn(a), s * 0.035f, body)
                      }
                  }

                  var yoff = 0f
                  val hd = (now - hopAt) / 1e9f
                  if (hopAt != 0L && hd < 0.45f) yoff = -Math.abs(sn(PI * hd / 0.45f)) * r * 0.5f
                  var scale = 1f + 0.03f * sn(t * 2f)
                  if (state == 1) scale = 1f + 0.06f * sn(t * 6f)
                  if (surprised) scale = 1.1f

                  canvas.save()
                  canvas.translate(0f, yoff)
                  if (walking) canvas.rotate(sn(t * 10f) * 6f, cx, cy)
                  canvas.scale(scale, scale, cx, cy)

                  body.color = col
                  canvas.drawCircle(cx, cy, r, body)
                  ring.color = Color.WHITE
                  ring.alpha = 255
                  ring.strokeWidth = s * 0.035f
                  canvas.drawCircle(cx, cy, r, ring)

                  canvas.drawCircle(cx - r * 0.68f, cy + r * 0.1f, r * 0.11f, ear)
                  canvas.drawCircle(cx + r * 0.68f, cy + r * 0.1f, r * 0.11f, ear)

                  val wob = sn(t * 3f) * r * (if (state == 1) 0.2f else 0.1f)
                  line.color = 0xFFB0BEC5.toInt()
                  line.strokeWidth = s * 0.025f
                  canvas.drawLine(cx, cy - r * 0.4f, cx + wob, cy - r * 0.7f, line)
                  canvas.drawCircle(cx + wob, cy - r * 0.7f, r * 0.09f, ball)

                  rect.set(cx - r * 0.62f, cy - r * 0.4f, cx + r * 0.62f, cy + r * 0.56f)
                  canvas.drawRoundRect(rect, r * 0.2f, r * 0.2f, head)

                  var bl = 1f
                  val ph2 = t % 3.7f
                  if (ph2 < 0.16f) bl = 1f - sn(PI * ph2 / 0.16f) * 0.92f
                  var er = r * 0.12f
                  if (state == 1) er *= 1.3f
                  if (surprised) er *= 1.5f
                  val dx = if (state == 2) sn(t * 2f) * r * 0.06f else 0f
                  val ex = r * 0.26f
                  val ey = cy - r * 0.06f
                  rect.set(cx - ex + dx - er, ey - er * bl, cx - ex + dx + er, ey + er * bl)
                  canvas.drawOval(rect, dark)
                  rect.set(cx + ex + dx - er, ey - er * bl, cx + ex + dx + er, ey + er * bl)
                  canvas.drawOval(rect, dark)

                  val my = cy + r * 0.3f
                  line.color = 0xFF263238.toInt()
                  line.strokeWidth = s * 0.03f
                  if (surprised) {
                      rect.set(cx - r * 0.08f, my - r * 0.1f, cx + r * 0.08f, my + r * 0.1f)
                      canvas.drawOval(rect, dark)
                  } else if (state == 3) {
                      val hh = r * 0.04f + Math.abs(sn(t * 11f)) * r * 0.14f
                      rect.set(cx - r * 0.14f, my - hh, cx + r * 0.14f, my + hh)
                      canvas.drawOval(rect, dark)
                  } else if (state == 1) {
                      canvas.drawCircle(cx, my, r * 0.07f, line)
                  } else if (state == 2) {
                      canvas.drawLine(cx - r * 0.12f, my, cx + r * 0.12f, my, line)
                  } else {
                      rect.set(cx - r * 0.18f, my - r * 0.14f, cx + r * 0.18f, my + r * 0.12f)
                      canvas.drawArc(rect, 20f, 140f, false, line)
                  }
                  canvas.restore()
              }
          }
          EOF
          cat > app/src/main/java/com/myagent/app/NotifService.kt <<'EOF'
          package com.myagent.app

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NItem(
              val key: String,
              val pkg: String,
              val app: String,
              val title: String,
              val text: String,
              val time: Long,
              val reply: Notification.Action?
          )

          object NotifStore {
              val items = ArrayList<NItem>()
              @Volatile var connected = false

              fun add(i: NItem) {
                  synchronized(items) {
                      items.removeAll { it.key == i.key }
                      items.add(0, i)
                      while (items.size > 40) items.removeAt(items.size - 1)
                  }
              }

              fun snapshot(): List<NItem> = synchronized(items) { ArrayList(items) }
          }

          class NotifService : NotificationListenerService() {
              override fun onListenerConnected() {
                  NotifStore.connected = true
                  try {
                      val act = activeNotifications
                      if (act != null) {
                          for (s in act) handle(s)
                      }
                  } catch (e: Exception) {
                  }
              }

              override fun onListenerDisconnected() {
                  NotifStore.connected = false
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn != null) handle(sbn)
              }

              private fun handle(sbn: StatusBarNotification) {
                  try {
                      val n = sbn.notification
                      if (sbn.packageName == packageName) return
                      if ((n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return
                      if (sbn.isOngoing) return
                      val ex = n.extras
                      val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                      val big = ex.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()
                      val text = big ?: ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                      if (title.isBlank() && text.isBlank()) return
                      var reply: Notification.Action? = null
                      val acts = n.actions
                      if (acts != null) {
                          for (a in acts) {
                              val ri = a.remoteInputs
                              if (ri != null && ri.isNotEmpty()) {
                                  reply = a
                                  break
                              }
                          }
                      }
                      val app = try {
                          packageManager.getApplicationLabel(packageManager.getApplicationInfo(sbn.packageName, 0)).toString()
                      } catch (e: Exception) {
                          sbn.packageName
                      }
                      NotifStore.add(NItem(sbn.key, sbn.packageName, app, title, text, sbn.postTime, reply))
                  } catch (e: Exception) {
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/myagent/app/MainActivity.kt <<'EOF'
          package com.myagent.app

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var keyBox: EditText
              private lateinit var modelBox: EditText
              private lateinit var status: TextView
              private val prefs by lazy { getSharedPreferences("agent", Context.MODE_PRIVATE) }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(40, 80, 40, 40)
                  keyBox = EditText(this)
                  keyBox.hint = "Gemini API key"
                  keyBox.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  keyBox.setText(prefs.getString("key", ""))
                  modelBox = EditText(this)
                  modelBox.hint = "Model"
                  modelBox.setText(prefs.getString("model", "gemini-2.5-flash"))
                  val startBtn = Button(this)
                  startBtn.text = "▶️ تشغيل الأفاتار"
                  startBtn.textSize = 20f
                  startBtn.setOnClickListener { startAgent() }
                  val stopBtn = Button(this)
                  stopBtn.text = "⏹ إيقاف الأفاتار"
                  stopBtn.setOnClickListener {
                      stopService(Intent(this, AgentService::class.java))
                      Bus.post("تم إيقاف الأفاتار")
                  }
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val memBtn = Button(this)
                  memBtn.text = "🧠 الذاكرة"
                  memBtn.textSize = 12f
                  memBtn.setOnClickListener { showMem() }
                  val newBtn = Button(this)
                  newBtn.text = "🔄 جديدة"
                  newBtn.textSize = 12f
                  newBtn.setOnClickListener {
                      Bus.resetHistory = true
                      Bus.post("بدأنا محادثة جديدة")
                  }
                  val modelsBtn = Button(this)
                  modelsBtn.text = "🔃 موديلات"
                  modelsBtn.textSize = 12f
                  modelsBtn.setOnClickListener {
                      savePrefs()
                      prefs.edit().putLong("mts", 0L).apply()
                      thread {
                          val k = prefs.getString("key", "") ?: ""
                          if (k.isBlank()) { Bus.post("اكتب المفتاح أولاً"); return@thread }
                          val l = discoverModels(prefs, k)
                          Bus.post("الموديلات المتاحة لمفتاحك:\n" + (if (l.isEmpty()) "ما قدرت أجيبها" else l.joinToString("\n")))
                      }
                  }
                  row.addView(memBtn, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(newBtn, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(modelsBtn, LinearLayout.LayoutParams(0, -2, 1f))

                  val row2 = LinearLayout(this)
                  row2.orientation = LinearLayout.HORIZONTAL
                  val filesBtn = Button(this)
                  filesBtn.text = "📁 الملفات"
                  filesBtn.textSize = 12f
                  filesBtn.setOnClickListener { openFilesAccess() }
                  val notifBtn = Button(this)
                  notifBtn.text = "🔔 الإشعارات"
                  notifBtn.textSize = 12f
                  notifBtn.setOnClickListener {
                      try {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                          Bus.post("فعّل MyAgent في قائمة الوصول للإشعارات")
                      } catch (e: Exception) {
                          Bus.post("تعذر فتح الإعدادات: " + e.message)
                      }
                  }
                  val wanderBtn = Button(this)
                  wanderBtn.textSize = 12f
                  fun refreshWander() {
                      wanderBtn.text = if (prefs.getBoolean("wander", true)) "🚶 تجول: شغال" else "🚶 تجول: متوقف"
                  }
                  wanderBtn.setOnClickListener {
                      prefs.edit().putBoolean("wander", !prefs.getBoolean("wander", true)).apply()
                      refreshWander()
                  }
                  refreshWander()
                  row2.addView(filesBtn, LinearLayout.LayoutParams(0, -2, 1f))
                  row2.addView(notifBtn, LinearLayout.LayoutParams(0, -2, 1f))
                  row2.addView(wanderBtn, LinearLayout.LayoutParams(0, -2, 1f))

                  status = TextView(this)
                  status.textSize = 16f
                  val scroll = ScrollView(this)
                  scroll.addView(status)
                  root.addView(keyBox)
                  root.addView(modelBox)
                  root.addView(startBtn)
                  root.addView(stopBtn)
                  root.addView(row)
                  root.addView(row2)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)
                  val need = allPerms().filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 1)
              }

              private fun allPerms(): List<String> {
                  val l = ArrayList<String>()
                  l.add(Manifest.permission.RECORD_AUDIO)
                  l.add(Manifest.permission.READ_CONTACTS)
                  l.add(Manifest.permission.CALL_PHONE)
                  l.add(Manifest.permission.SEND_SMS)
                  l.add(Manifest.permission.READ_SMS)
                  if (Build.VERSION.SDK_INT >= 33) l.add(Manifest.permission.POST_NOTIFICATIONS)
                  return l
              }

              private fun openFilesAccess() {
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          if (android.os.Environment.isExternalStorageManager()) {
                              Bus.post("صلاحية الملفات مفعّلة بالفعل ✅")
                              return
                          }
                          startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + packageName)))
                          Bus.post("فعّل السماح بالوصول لكل الملفات ثم ارجع")
                      } else {
                          requestPermissions(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE), 3)
                      }
                  } catch (e: Exception) {
                      Bus.post("تعذر فتح الإعدادات: " + e.message)
                  }
              }

              private fun savePrefs() {
                  prefs.edit()
                      .putString("key", keyBox.text.toString().trim())
                      .putString("model", modelBox.text.toString().trim())
                      .apply()
              }

              override fun onResume() {
                  super.onResume()
                  status.text = synchronized(Bus.buf) { Bus.buf.toString() }
                  Bus.listener = { s: String -> runOnUiThread { status.append(s + "\n\n") } }
              }

              override fun onPause() {
                  super.onPause()
                  Bus.listener = null
                  savePrefs()
              }

              private fun startAgent() {
                  savePrefs()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Bus.post("اسمح بصلاحية الميكروفون ثم اضغط تشغيل مرة أخرى")
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 2)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Bus.post("فعّل خيار العرض فوق التطبيقات الأخرى للتطبيق ثم ارجع واضغط تشغيل")
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      return
                  }
                  if ((prefs.getString("key", "") ?: "").isBlank()) {
                      Bus.post("اكتب مفتاح Gemini أولاً")
                      return
                  }
                  try {
                      startForegroundService(Intent(this, AgentService::class.java))
                      Bus.post("تم تشغيل الأفاتار. اضغط زر Home وستجد الروبوت 🤖 فوق الشاشة.")
                  } catch (e: Exception) {
                      Bus.post("تعذر تشغيل الخدمة: " + e.message)
                  }
              }

              private fun showMem() {
                  val l = (prefs.getString("mem", "") ?: "").split("\n").filter { it.isNotBlank() }
                  val text = if (l.isEmpty()) "الذاكرة فاضية" else l.mapIndexed { i, s -> "" + (i + 1) + ". " + s }.joinToString("\n")
                  AlertDialog.Builder(this)
                      .setTitle("الذاكرة")
                      .setMessage(text)
                      .setPositiveButton("إغلاق", null)
                      .setNegativeButton("مسح الكل") { _, _ ->
                          prefs.edit().putString("mem", "").apply()
                          Bus.resetHistory = true
                          Bus.post("تم مسح الذاكرة")
                      }
                      .show()
              }
          }
          EOF
